<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - ClinicBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">ClinicBook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="book.html">Book Appointment</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointments.html">My Appointments</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">More</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="doctors.html">Our Doctors</a></li>
                            <li><a class="dropdown-item" href="admin.html">Admin</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONFIRMATION BOX -->
    <div class="container my-5">
        <div class="success-box-container p-5 border bg-light text-center">
            <div class="big-icon-box mx-auto mb-3"></div>
            <h2 class="fw-bold mb-2">Booking Successful!</h2>
            <p class="text-muted">Your appointment has been saved to the database.</p>

            <div class="confirm-detail-box bg-white border p-3 mt-4 d-inline-block" id="confirmDetails">
                Loading...
            </div>

            <div class="mt-4">
                <a href="appointments.html" class="btn btn-secondary btn-lg me-2">My Appointments</a>
                <a href="../index.html" class="btn btn-secondary btn-lg">Back to Home</a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-3 mt-5">
        <p class="mb-0">2025 ClinicBook</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/script.js"></script>
    <script>
        // Show the booking details saved from book.html
        const saved = localStorage.getItem('lastAppointment');
        const box = document.getElementById('confirmDetails');

        if (saved) {
            const appt = JSON.parse(saved);
            const date = new Date(appt.date).toLocaleDateString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric'
            });
            const timeMap = {
                '09:00:00': '9:00 AM',
                '10:00:00': '10:00 AM',
                '11:00:00': '11:00 AM',
                '14:00:00': '2:00 PM',
                '15:00:00': '3:00 PM'
            };
            const time = timeMap[appt.time] || appt.time;

            box.innerHTML = `
                <strong>Doctor:</strong> ${appt.doctorName} &nbsp;|&nbsp;
                <strong>Date:</strong> ${date} &nbsp;|&nbsp;
                <strong>Time:</strong> ${time}
            `;
            localStorage.removeItem('lastAppointment');
        } else {
            box.textContent = 'Appointment booked successfully.';
        }
    </script>
</body>
</html>
